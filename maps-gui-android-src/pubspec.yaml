name: maps_gui_android
description: מפה אינטראקטיבית — גבהים, טמפרטורות, מסלולי טיסה ומזג אוויר
publish_to: 'none'  # קוד קנייני (All Rights Reserved) — מונע פרסום בטעות ל-pub.dev
homepage: https://israelalaluf.com  # אתר הבעלים (Israel Alalouf) — ר' LICENSE
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  provider: ^6.1.2
  material_symbols_icons: ^4.2719.3
  geolocator: ^13.0.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/user_guide.md  # מדריך ההפעלה — build_apk.ps1 מעתיק אליו את מדריך-הפעלה-Android.md בכל בנייה
